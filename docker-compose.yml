services:
  # --- Melofy Backend (API) ---
  api:
    container_name: melofy-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Lavalink / NodeLink config
      LAVALINK_HOST: ${LAVALINK_HOST:-nodelink}
      LAVALINK_PORT: ${LAVALINK_PORT:-2333}
      LAVALINK_NAME: ${LAVALINK_NAME:-melofy}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      LAVALINK_SECURE: ${LAVALINK_SECURE:-false}
      # API Config
      TRUST_PROXY: ${TRUST_PROXY:-true}
      STREAM_TICKET_SECRET: ${STREAM_TICKET_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://melofy.jene.in}
      # External APIs
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      GENIUS_LYRICS_API: ${GENIUS_LYRICS_API}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      # Firebase Service Account (Base64 env var)
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64}
    networks:
      - melofy_network
    restart: unless-stopped
    depends_on:
      - nodelink

  # --- Melofy Frontend (Web) ---
  web:
    container_name: melofy-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Build-time args baked into Next.js client bundle
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
        UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
        BACKEND_API_URL: ${BACKEND_API_URL:-http://api:3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_API_URL: ${BACKEND_API_URL:-http://api:3001}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64}
    networks:
      - melofy_network
    depends_on:
      - api
    restart: unless-stopped

  # --- NodeLink Audio Streaming Engine ---
  nodelink:
    container_name: melofy-nodelink
    build:
      context: ./docker/nodelink
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LAVALINK_PORT:-2333}:2333"
    environment:
      - NODELINK_SERVER_PORT=2333
      - NODELINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - NODELINK_SERVER_HOST=0.0.0.0
    networks:
      - melofy_network

networks:
  melofy_network:
    driver: bridge
